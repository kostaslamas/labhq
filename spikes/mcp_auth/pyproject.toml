[project]
name = "labhq-mcp-auth-spike"
version = "0.0.1"
description = "Phase 0 spike: MCP server with built-in bearer auth"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_auth"]
