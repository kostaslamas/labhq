name: Platforms

# Plan §9: Linux and macOS are supported, native Windows is best effort with this matrix.
# Kept apart from ci.yml so the two never collide; ci.yml stays the Linux gate.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      # One platform's failure must not hide another's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      LABHQ_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Tests
        run: uv run --frozen pytest -ra
