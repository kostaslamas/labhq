name: Platforms

# Plan §9: Linux and macOS are supported, native Windows is best effort with this matrix.
# Kept apart from ci.yml so the two never collide; ci.yml stays the Linux gate.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      # One platform's failure must not hide another's.
      fail-fast: false
      matrix:
        # Windows is paused by the owner's decision for the current phase (its jobs take
        # about 45 minutes). To re-enable it, add windows-latest back to this list.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Leave room before the cut-off; native Windows, when enabled, is the slowest.
    timeout-minutes: 60
    env:
      LABHQ_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      # The tmux adapter tests run a real private tmux server. Native Windows has no tmux
      # (ADR 0003); its tests are marked posix_only there.
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      # A test that hangs dumps every thread's stack instead of dying silently at the
      # job's timeout.
      - name: Tests
        run: uv run --frozen pytest -ra -o faulthandler_timeout=300

      - name: Limitations guide matches the markers
        run: uv run --frozen python -m tools.platform_limits
