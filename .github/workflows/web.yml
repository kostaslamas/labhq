name: Web

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18 or later runs the TypeScript check scripts without a loader.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          uv sync --frozen

      # Drift guard: the committed schema and client must be what the current API generates,
      # so an API change pushed without `npm run api:generate` fails here.
      - name: API client matches the API
        run: |
          npm run api:generate
          git diff --exit-code -- openapi.json src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: i18n keys
        run: npm run i18n:check

      - name: Build
        run: npx vite build

      - name: Bundle references no external host
        run: npm run dist:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"

      - name: Install
        run: |
          npm ci
          uv sync --frozen

      - name: Build the UI
        run: npx vite build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The global setup seeds a temporary database with the fake adapter and runs
      # `labhq serve` on it with the built UI (e2e/support/server.ts).
      - name: End-to-end tests against a seeded labhq
        run: npm run test:e2e

      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 7
