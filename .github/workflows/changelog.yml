name: Changelog

# CHANGELOG.md is generated from the history, never edited by hand (CONTRIBUTING.md §5).
# Regenerate it from the tags this commit can reach and fail on any difference.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  generated:
    name: CHANGELOG.md matches the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit and tag: git-cliff walks the history to build each tag's section.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.8.17"
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Regenerate and compare
        run: uv run --frozen python -m tools.changelog --check
