[project]
name = "labhq"
version = "0.1.0a1"
description = "Self-hosted project orchestrator for one person, many projects and a team of AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=2.2,<3",
    "platformdirs>=4.3",
    "psutil>=6.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.15",
    "uvicorn>=0.54.0",
    "webauthn>=3.0.1",
    "websockets>=17.1",
]

[project.scripts]
labhq = "labhq.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "types-psutil>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labhq"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep CHECK constraint literals on one line.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["labhq", "tools"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.labhq.file_size]
# CONTRIBUTING.md §2. Locks and Python fixtures live outside these roots.
roots = ["src", "tests", "tools", "web/src", "web/e2e"]
suffixes = [".py", ".ts", ".vue"]
# Exempt by kind: i18n resources, generated code and test fixtures. `*` crosses directories.
exclude = [
  "web/src/*/locales/*",
  "web/src/*/generated/*",
  "web/src/*.gen.ts",
  "web/src/*.d.ts",
  "web/src/*/__fixtures__/*",
]
soft_limit = 400
hard_limit = 600
# Each exemption: { path = "...", date = "YYYY-MM-DD", reason = "..." }.
exemptions = []

[tool.labhq.collection_floor]
# CI fails when pytest collects fewer tests than this. Raise it as the suite grows.
min_tests = 90
