[project]
name = "labhq"
version = "0.1.0a1"
description = "Self-hosted project orchestrator for one person, many projects and a team of AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "labhq contributors" }]
keywords = [
    "ai-agents",
    "claude",
    "claude-code",
    "orchestrator",
    "self-hosted",
    "homelab",
    "mcp",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "a2a-sdk>=1.2.2",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "asyncssh>=2.17",
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=2.2,<3",
    "platformdirs>=4.3",
    "psutil>=6.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "typer>=0.15",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
    "webauthn>=3.0.1",
    "websockets>=17.1",
]

[project.urls]
Homepage = "https://github.com/kostaslamas/labhq"
Source = "https://github.com/kostaslamas/labhq"
Issues = "https://github.com/kostaslamas/labhq/issues"
Changelog = "https://github.com/kostaslamas/labhq/blob/main/CHANGELOG.md"
Security = "https://github.com/kostaslamas/labhq/blob/main/SECURITY.md"

[project.scripts]
labhq = "labhq.cli:app"

[dependency-groups]
dev = [
    "git-cliff>=2.14.2",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
    "types-protobuf>=7.35.1.20260906",
    "types-psutil>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labhq"]

# `uvx labhq onboard` runs from the wheel alone, so the migrations travel inside the package.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "labhq/migrations"

# Builds `web/` and packages it as `labhq/web/`; `LABHQ_SKIP_WEB_BUILD=1` opts out (#68).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/build_web.py"

# The sdist carries the UI sources so a wheel built from it has the UI; never its build output.
[tool.hatch.build.targets.sdist]
exclude = ["web/node_modules", "web/dist", "web/test-results", "web/playwright-report"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep CHECK constraint literals on one line.
"migrations/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["labhq", "tools"]

[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Platform limitation markers and the no-skip rule (tests/platforms.py).
    "-p",
    "tests.platforms",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.labhq.file_size]
# CONTRIBUTING.md §2. Locks and Python fixtures live outside these roots.
roots = ["src", "tests", "tools", "web/src", "web/e2e"]
suffixes = [".py", ".ts", ".vue"]
# Exempt by kind: i18n resources, generated code and test fixtures. `*` crosses directories.
exclude = [
  "web/src/*/locales/*",
  "web/src/*/generated/*",
  "web/src/*.gen.ts",
  "web/src/*.d.ts",
  "web/src/*/__fixtures__/*",
]
soft_limit = 400
hard_limit = 600
# Each exemption: { path = "...", date = "YYYY-MM-DD", reason = "..." }.
exemptions = []

[tool.labhq.collection_floor]
# CI fails when pytest collects fewer tests than this. Raise it as the suite grows.
min_tests = 90
